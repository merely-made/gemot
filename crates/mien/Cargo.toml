[package]
rust-version = "1.97.1"
name = "mien"
version = "0.0.1"
repository = "https://github.com/merely-made/gemot"
description = "A mien is a persona's standing as one moot sees it: reputation in the Mere platform's moot tier, which is per-moot primary with no global score. A viewer moot folds its own ledger together with the moots it concords, one hop and no further, under a composition policy it chooses. A mien is therefore always someone's view of someone, never an objective fact about them."
readme = "README.md"
keywords = [
    "reputation",
    "standing",
    "moot",
    "federation",
    "trust",
]
categories = [
    "algorithms",
]

[package.edition]
workspace = true

[package.license]
workspace = true

[dependencies]
p2panda-core = "0.7.0"
thiserror = "1"

[dependencies.insigne]
workspace = true

[dependencies.identity]
workspace = true

[dependencies.muniment]
workspace = true
features = [
    "redb",
]

[dependencies.p2panda-store]
version = "0.7.0"
default-features = false

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.stickleback]
workspace = true

[dev-dependencies]
p2panda-sync = "0.7.0"
tempfile = "3"
tokio-stream = "0.1"

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
]

[dev-dependencies.transport]
workspace = true
features = [
    "test-identity",
]
