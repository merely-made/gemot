[package]
rust-version = "1.97.1"
name = "commons-spine"
version = "0.0.1"
edition = "2024"
publish = false
repository = "https://github.com/merely-made/gemot"

[package.license]
workspace = true

[dependencies]
p2panda-core = "0.7.0"
thiserror = "1"

[dependencies.insigne]
workspace = true
features = [
    "verify",
]

[dependencies.chartulary]
workspace = true

[dependencies.muniment]
workspace = true
features = [
    "redb",
]

[dependencies.personae]
workspace = true

[dependencies.proofs]
workspace = true

[dependencies.servitor]
workspace = true

[dependencies.stickleback]
workspace = true

[dependencies.gemot]
workspace = true

[dependencies.p2panda-encryption]
version = "0.7.0"
features = [
    "data_scheme",
    "message_scheme",
]

[dependencies.p2panda-store]
version = "0.7.0"
default-features = false

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dev-dependencies]
hex = "0.4"
proptest = "1"
serde_json = "1"
tempfile = "3"

[dev-dependencies.murm]
workspace = true

[dev-dependencies.transport]
workspace = true
features = [
    "reticulum",
    "test-identity",
]

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
]

[lib]
path = "src/lib.rs"
