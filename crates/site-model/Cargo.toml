[package]
"name" = "gemot-site"
"version" = "0.1.0"
"edition" = "2024"
"rust-version" = "1.97.1"
"license" = "MPL-2.0"
"repository" = "https://github.com/merely-made/gemot"
"description" = "Portable native-site manifests and canonical publication snapshots"

[dependencies]
gemot-address = { version = "0.1.0", path = "../address" }
scroll-protocol = { version = "=0.1.0", git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763", default-features = false, optional = true }
gemini-protocol = { version = "=0.1.7", git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763", default-features = false, optional = true }
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"], optional = true }
"serde" = { "version" = "1", "features" = ["derive"] }
"serde_json" = { "version" = "1" }
"blake3" = { "version" = "1" }
"language-tags" = "0.3"
"time" = { "version" = "0.3", "features" = ["parsing"] }
"muniment" = { "version" = "0.2.1", "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
"eidetic" = { "version" = "0.0.3", "default-features" = false, "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b", "optional" = true }
"gemot" = { "version" = "0.1.1", "git" = "https://www.github.com/merely-made/gemot.git", "rev" = "4627ad5498197b49cefa5141317abd66c2af7e74", "optional" = true }
"personae" = { "version" = "0.3.1", "git" = "https://github.com/merely-made/dramatis.git", "branch" = "main", "optional" = true }
"stickleback" = { "version" = "0.2.0", "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }

[features]
generate = ["dep:pulldown-cmark", "dep:scroll-protocol", "dep:gemini-protocol"]
"default" = []
"history" = []
"publication" = ["dep:eidetic", "dep:gemot", "dep:personae"]

[dev-dependencies]
"async-trait" = "0.1"
"pollster" = "0.4"
"tempfile" = "3"
"muniment" = { "version" = "0.2.1", "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b", "features" = ["directory", "redb"] }
"proofs" = { "package" = "mere-proofs", "version" = "0.1.0", "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
"servitor" = { "version" = "0.0.3", "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
"mien" = { "version" = "0.0.1", "git" = "https://www.github.com/merely-made/gemot.git", "rev" = "4627ad5498197b49cefa5141317abd66c2af7e74" }

[lints]
"workspace" = true

[workspace]
"resolver" = "2"
"lints" = { "rust" = { "unsafe_code" = "warn" }, "clippy" = { "all" = "warn", "missing_errors_doc" = "warn", "missing_panics_doc" = "warn", "missing_safety_doc" = "warn", "undocumented_unsafe_blocks" = "warn", "too_many_lines" = "warn" } }

