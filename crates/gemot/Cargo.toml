[package]
rust-version = "1.97.1"
name = "gemot"
version = "0.1.1"
repository = "https://github.com/merely-made/gemot"
description = "Community domain and assembly layer for Moot governance, replication, Standing, Tulpa, and FLORA."
documentation = "https://docs.rs/gemot"
readme = "README.md"
keywords = [
    "federation",
    "community",
    "social",
    "p2p",
    "browser",
]
categories = [
    "network-programming",
]

[package.edition]
workspace = true

[package.license]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
p2panda-core = "0.7.0"
redb = "2"
thiserror = "1"

[dependencies.insigne]
workspace = true
features = [
    "verify",
]

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.p2panda-auth]
version = "0.7.0"
default-features = false

[dependencies.p2panda-encryption]
version = "0.7.0"
default-features = false
features = [
    "data_scheme",
]

[dependencies.identity]
workspace = true

[dependencies.servitor]
workspace = true

[dependencies.stickleback]
workspace = true

[dependencies.proofs]
workspace = true

[dependencies.p2panda-store]
version = "0.7.0"
default-features = false

[dependencies.mooting]
workspace = true

[dependencies.mien]
workspace = true

[dependencies.muniment]
workspace = true
features = [
    "redb",
]

[dev-dependencies]
p2panda-sync = "0.7.0"
tokio-stream = "0.1"
tempfile = "3"
rcgen = "0.13"

[dev-dependencies.chartulary]
workspace = true

[dev-dependencies.transport]
workspace = true
features = [
    "test-identity",
]

[dev-dependencies.p2panda-net]
package = "mere-p2panda-net"
version = "=0.7.5"
default-features = false
features = [
    "address_book",
    "iroh_endpoint",
    "iroh_mdns",
    "discovery",
    "gossip",
    "sync",
]

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
]

[dev-dependencies.errand]
workspace = true
features = [
    "serve",
]

[dev-dependencies.gemini-protocol]
workspace = true
features = [
    "server",
]

[dev-dependencies.rustls]
version = "0.23"
default-features = false
features = [
    "ring",
    "std",
]

[dev-dependencies.serde_json]
workspace = true

[dev-dependencies.eidetic]
workspace = true
default-features = false
features = [
    "pack-signing",
]
