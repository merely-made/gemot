[package]
rust-version = "1.97.1"
name = "gemot"
version = "0.1.1"
repository = "https://github.com/merely-made/gemot"
description = "Community domain and assembly layer for Moot governance, replication, Standing, Tulpa, and FLORA."
documentation = "https://docs.rs/gemot"
readme = "README.md"
keywords = [
    "federation",
    "community",
    "social",
    "p2p",
    "browser",
]
categories = [
    "network-programming",
]

[package.edition]
workspace = true

[package.license]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
work-host = ["dep:eidetic", "dep:eidetic-search", "dep:serde_json"]
# Typed private coordination over existing group encryption and sync sessions.
relay-pool = ["dep:tokio"]
relay-pool-native = ["relay-pool", "dep:murm", "dep:notochord"]
relay-pool-i2p = ["relay-pool-native", "murm/relay-i2p", "dep:transport", "tokio/rt", "tokio/macros"]
relay-pool-runner = ["relay-pool-i2p", "dep:castellan-client"]

[[example]]
name = "relay-pool"
required-features = ["relay-pool-runner"]

[dependencies]
url = "2"
eidetic = { workspace = true, optional = true }
eidetic-search = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
murm-sync.workspace = true
p2panda-core = { package = "p2mere-core", version = "0.10" }
redb = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"], optional = true }
murm = { workspace = true, optional = true, features = ["relay"] }
notochord = { workspace = true, optional = true }
transport = { workspace = true, optional = true }

[dependencies.castellan-client]
version = "0.0.2"
git = "https://github.com/merely-made/dramatis.git"
branch = "main"
features = ["client"]
optional = true

[dependencies.insigne]
workspace = true
features = [
    "verify",
]

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.p2panda-auth]
package = "p2mere-auth"
version = "0.10"
default-features = false

[dependencies.p2panda-encryption]
package = "p2mere-encryption"
version = "0.10"
default-features = false
features = [
    "data_scheme",
]

[dependencies.identity]
workspace = true

[dependencies.servitor]
workspace = true

[dependencies.stickleback]
workspace = true

[dependencies.proofs]
workspace = true

[dependencies.p2panda-store]
package = "p2mere-store"
version = "0.10"
default-features = false

[dependencies.mooting]
workspace = true

[dependencies.mien]
workspace = true

[dependencies.muniment]
workspace = true
features = [
    "redb",
]

[dev-dependencies]
p2panda-sync = { package = "p2mere-sync", version = "0.10" }
tokio-stream = "0.1"
tempfile = "3"
rcgen = "0.14"

[dev-dependencies.portolan]
workspace = true

[dev-dependencies.transport]
workspace = true
features = [
    "test-identity",
    "noise",
    "notochord",
]

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
    "test-util",
]

[dev-dependencies.errand]
workspace = true
features = [
    "serve",
]

[dev-dependencies.gemini-protocol]
workspace = true
features = [
    "server",
]

[dev-dependencies.rustls]
version = "0.23"
default-features = false
features = [
    "ring",
    "std",
]

[dev-dependencies.serde_json]
workspace = true

[dev-dependencies.eidetic]
workspace = true
default-features = false
features = [
    "pack-signing",
]

[lints]
workspace = true
