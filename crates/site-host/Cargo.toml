[workspace]
"package" = { "rust-version" = "1.97.1" }
"lints" = { "clippy" = { "missing_errors_doc" = "warn", "missing_panics_doc" = "warn", "missing_safety_doc" = "warn", "undocumented_unsafe_blocks" = "warn", "too_many_lines" = "warn" } }
"resolver" = "2"

[package]
"name" = "gemot-site-host"
"version" = "0.0.1"
"edition" = "2024"
"rust-version" = "1.97.1"
"license" = "MPL-2.0"
"description" = "Shared native site files, immutable publication, serving and resident handoff"
"repository" = "https://github.com/merely-made/gemot"

[dependencies]
"site-model" = { "package" = "gemot-site", "version" = "0.1.0", "path" = "../site-model" }
"muniment" = { "version" = "0.2.1", "git" = "https://github.com/merely-made/eidetic.git", "branch" = "main", "optional" = true }
"gemot" = { "version" = "0.1.1", "git" = "https://github.com/merely-made/gemot.git", "branch" = "main", "optional" = true }
"personae" = { "version" = "0.3.0", "git" = "https://github.com/merely-made/dramatis.git", "branch" = "main", "optional" = true }
"zeroize" = { "version" = "1", "optional" = true }
"stickleback" = { "version" = "0.3", "git" = "https://github.com/merely-made/eidetic.git", "branch" = "main", "optional" = true }
"proofs" = { "package" = "mere-proofs", "version" = "0.1.0", "git" = "https://github.com/merely-made/eidetic.git", "branch" = "main", "optional" = true }
"servitor" = { "version" = "0.0.3", "git" = "https://github.com/merely-made/eidetic.git", "branch" = "main", "optional" = true }
"mien" = { "version" = "0.0.1", "git" = "https://github.com/merely-made/gemot.git", "branch" = "main", "optional" = true }
"sha2" = { "version" = "0.11", "optional" = true }
"serde" = { "version" = "1", "features" = ["derive"] }
"serde_json" = "1"
"scroll-protocol" = { "version" = "0.1.0", "default-features" = false }
"rustls" = { "version" = "0.23", "default-features" = false, "features" = ["ring", "std", "tls12"] }
"rcgen" = "0.14"
"url" = "2"
"gemini-protocol" = { "version" = "0.1.7", "features" = ["server"] }
"spartan-protocol" = "0.1.1"
"tokio" = { "version" = "1", "features" = ["rt", "sync", "net", "time", "macros"] }
"blake3" = "1"
"murm-resolve" = { "version" = "0.0.1", "git" = "https://github.com/merely-made/murm.git", "branch" = "main", "optional" = true }
"retinue" = { "git" = "https://github.com/merely-made/murm.git", "branch" = "main", "optional" = true }
"getrandom" = { "version" = "0.2", "optional" = true }
"tempfile" = "3"

[dev-dependencies]
"muniment" = { "version" = "0.2.1", "git" = "https://github.com/merely-made/eidetic.git", "branch" = "main", "features" = ["directory"] }
"tempfile" = "3"
"tokio-rustls" = { "version" = "0.26", "default-features" = false, "features" = ["ring", "tls12"] }

[patch]
"crates-io" = { "hodograph" = { "git" = "https://github.com/merely-made/eidetic.git", "branch" = "main" }, "portolan" = { "git" = "https://github.com/merely-made/eidetic.git", "branch" = "main" }, "eidetic" = { "git" = "https://github.com/merely-made/eidetic.git", "branch" = "main" }, "scroll-protocol" = { "git" = "https://github.com/merely-made/errand.git", "branch" = "main" }, "servitor" = { "git" = "https://github.com/merely-made/eidetic.git", "branch" = "main" }, "spartan-protocol" = { "git" = "https://github.com/merely-made/errand.git", "branch" = "main" }, "stickleback" = { "git" = "https://github.com/merely-made/eidetic.git", "branch" = "main" }, "muniment" = { "git" = "https://github.com/merely-made/eidetic.git", "branch" = "main" }, "mere-proofs" = { "git" = "https://github.com/merely-made/eidetic.git", "branch" = "main" }, "gemini-protocol" = { "git" = "https://github.com/merely-made/errand.git", "branch" = "main" } }
"https://github.com/merely-made/mere.git" = {  }
"https://github.com/merely-made/retinue.git" = { "retinue" = { "git" = "https://github.com/merely-made/murm.git", "branch" = "main" } }
"https://github.com/merely-made/distillery.git" = {  }

[features]
generate = ["site-model/generate"]
"default" = []
"history" = ["site-model/history", "dep:muniment"]
"publication" = ["site-model/publication", "dep:muniment", "muniment/redb", "dep:gemot", "dep:personae", "dep:zeroize", "dep:stickleback"]
"runtime-acceptance" = ["publication", "dep:proofs", "dep:servitor", "dep:mien", "dep:sha2"]
"retinue" = ["dep:retinue", "dep:getrandom"]
"murm-resolve" = ["dep:murm-resolve"]


[[test]]
"name" = "release_address"
"path" = "tests/release_address.rs"
"required-features" = ["murm-resolve"]

[[test]]
"name" = "nomadnet"
"path" = "tests/nomadnet.rs"
"required-features" = ["retinue"]

[[bin]]
"name" = "site-publish"
"path" = "src/bin/knot_site_publish.rs"
"required-features" = ["publication"]

[lints]
"workspace" = true

[[bin]]
name = "site-build"
path = "src/bin/site_build.rs"
required-features = ["generate"]
