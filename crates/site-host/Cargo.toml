[workspace]
"package" = { "rust-version" = "1.97.1" }
"lints" = { "clippy" = { "missing_errors_doc" = "warn", "missing_panics_doc" = "warn", "missing_safety_doc" = "warn", "undocumented_unsafe_blocks" = "warn", "too_many_lines" = "warn" } }
"resolver" = "2"

[package]
"name" = "gemot-site-host"
"version" = "0.0.1"
"edition" = "2024"
"rust-version" = "1.97.1"
"license" = "MPL-2.0"
"description" = "Shared native site files, immutable publication, serving and resident handoff"
"repository" = "https://github.com/merely-made/gemot"

[dependencies]
"site-model" = { "package" = "gemot-site", "version" = "0.1.0", "path" = "../site-model" }
"muniment" = { "version" = "0.2.1", "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160", "optional" = true }
"gemot" = { "version" = "0.1.1", "git" = "https://www.github.com/merely-made/gemot.git", "rev" = "3766de48777859d1571fef245c8c87a9e37df638", "optional" = true }
"personae" = { "version" = "0.3.0", "git" = "https://github.com/merely-made/dramatis.git", "branch" = "main", "optional" = true }
"zeroize" = { "version" = "1", "optional" = true }
"stickleback" = { "version" = "0.2.0", "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160", "optional" = true }
"proofs" = { "package" = "mere-proofs", "version" = "0.1.0", "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160", "optional" = true }
"servitor" = { "version" = "0.0.3", "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160", "optional" = true }
"mien" = { "version" = "0.0.1", "git" = "https://www.github.com/merely-made/gemot.git", "rev" = "3766de48777859d1571fef245c8c87a9e37df638", "optional" = true }
"sha2" = { "version" = "0.11", "optional" = true }
"serde" = { "version" = "1", "features" = ["derive"] }
"serde_json" = "1"
"scroll-protocol" = { "version" = "=0.1.0", "default-features" = false }
"rustls" = { "version" = "0.23", "default-features" = false, "features" = ["ring", "std", "tls12"] }
"rcgen" = "0.13.2"
"url" = "2"
"gemini-protocol" = { "version" = "=0.1.7", "features" = ["server"] }
"spartan-protocol" = "=0.1.1"
"tokio" = { "version" = "1", "features" = ["rt", "sync", "net", "time", "macros"] }
"blake3" = "1"
"retinue" = { "git" = "https://www.github.com/merely-made/murm.git", "rev" = "ce53cebb2ae9f420de5a0dcaa5a9768c639910af", "optional" = true }
"getrandom" = { "version" = "0.2", "optional" = true }
"tempfile" = "3"

[dev-dependencies]
"muniment" = { "version" = "0.2.1", "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160", "features" = ["directory"] }
"tempfile" = "3"
"tokio-rustls" = { "version" = "0.26", "default-features" = false, "features" = ["ring", "tls12"] }

[patch]
"crates-io" = { "chartulary" = { "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160" }, "eidetic" = { "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160" }, "scroll-protocol" = { "git" = "https://github.com/merely-made/errand.git", "rev" = "897fb963d184f0e379ab9041d68e17e726cb7763" }, "servitor" = { "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160" }, "spartan-protocol" = { "git" = "https://github.com/merely-made/errand.git", "rev" = "897fb963d184f0e379ab9041d68e17e726cb7763" }, "stickleback" = { "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160" }, "mere-p2panda-net" = { "git" = "https://github.com/mark-ik/p2panda.git", "tag" = "mere-p2panda-net-0.7.5-upstream-20261013" }, "p2panda-auth" = { "git" = "https://github.com/mark-ik/p2panda.git", "tag" = "mere-p2panda-net-0.7.5-upstream-20261013" }, "p2panda-core" = { "git" = "https://github.com/mark-ik/p2panda.git", "tag" = "mere-p2panda-net-0.7.5-upstream-20261013" }, "p2panda-discovery" = { "git" = "https://github.com/mark-ik/p2panda.git", "tag" = "mere-p2panda-net-0.7.5-upstream-20261013" }, "p2panda-encryption" = { "git" = "https://github.com/mark-ik/p2panda.git", "tag" = "mere-p2panda-net-0.7.5-upstream-20261013" }, "p2panda-store" = { "git" = "https://github.com/mark-ik/p2panda.git", "tag" = "mere-p2panda-net-0.7.5-upstream-20261013" }, "p2panda-sync" = { "git" = "https://github.com/mark-ik/p2panda.git", "tag" = "mere-p2panda-net-0.7.5-upstream-20261013" }, "muniment" = { "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160" }, "mere-proofs" = { "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160" }, "gemini-protocol" = { "git" = "https://github.com/merely-made/errand.git", "rev" = "897fb963d184f0e379ab9041d68e17e726cb7763" } }
"https://github.com/merely-made/mere.git" = {  }
"https://github.com/merely-made/retinue.git" = { "retinue" = { "git" = "https://www.github.com/merely-made/murm.git", "rev" = "ce53cebb2ae9f420de5a0dcaa5a9768c639910af" } }
"https://github.com/merely-made/eidetic.git" = { "chartulary" = { "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160" }, "eidetic" = { "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160" }, "mere-proofs" = { "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160" }, "muniment" = { "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160" }, "servitor" = { "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160" }, "stickleback" = { "git" = "https://www.github.com/merely-made/eidetic.git", "rev" = "7a3453a02bc7dea391ef18814c1bfa1a46e67160" } }
"https://github.com/merely-made/distillery.git" = {  }
"https://github.com/merely-made/murm.git" = { "murm-sync" = { "git" = "https://www.github.com/merely-made/murm.git", "rev" = "ce53cebb2ae9f420de5a0dcaa5a9768c639910af" }, "retinue" = { "git" = "https://www.github.com/merely-made/murm.git", "rev" = "ce53cebb2ae9f420de5a0dcaa5a9768c639910af" } }

[features]
generate = ["site-model/generate"]
"default" = []
"history" = ["site-model/history", "dep:muniment"]
"publication" = ["site-model/publication", "dep:muniment", "muniment/redb", "dep:gemot", "dep:personae", "dep:zeroize", "dep:stickleback"]
"runtime-acceptance" = ["publication", "dep:proofs", "dep:servitor", "dep:mien", "dep:sha2"]
"retinue" = ["dep:retinue", "dep:getrandom"]

[[test]]
"name" = "nomadnet"
"path" = "tests/nomadnet.rs"
"required-features" = ["retinue"]

[[bin]]
"name" = "site-publish"
"path" = "src/bin/knot_site_publish.rs"
"required-features" = ["publication"]

[lints]
"workspace" = true

[[bin]]
name = "site-build"
path = "src/bin/site_build.rs"
required-features = ["generate"]
