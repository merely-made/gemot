[package]
rust-version = "1.97.1"
name = "mooting"
version = "0.1.0"
repository = "https://github.com/merely-made/gemot"
description = "Protocol core for community social-primitives selection — inner layer of gemot for the Mere browser."
documentation = "https://docs.rs/mooting"
readme = "README.md"
keywords = [
    "protocol",
    "social",
    "community",
    "federation",
]
categories = [
    "network-programming",
]

[package.edition]
workspace = true

[package.license]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
p2panda-core = "0.7.0"
thiserror = "1"

[dependencies.serde]
version = "1"
features = [
    "derive",
]
