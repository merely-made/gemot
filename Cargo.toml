[workspace]
resolver = "2"
# Independent ordinary-site crates; their optional Moot adapter has its own gate.
exclude = ["crates/address", "crates/site-model", "crates/site-host"]
members = [
    "crates/gemot",
    "crates/mooting",
    "crates/mien",
    "crates/moothold",
    "crates/commons",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/gemot"
authors = [
    "Mark AB (markik)",
]

[workspace.dependencies]
murm-sync = { version = "0.0.1", git = "https://www.github.com/merely-made/murm.git", rev = "bc82e1aa92e4076bd12b1910b3fe3ab992b7acb8" }
notochord = { version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["tokio"] }
serde_json = "1"

[workspace.dependencies.insigne]
version = "0.0.2"
git = "https://github.com/merely-made/dramatis.git"
branch = "main"

[workspace.dependencies.identity]
package = "personae"
version = "0.3.0"
git = "https://github.com/merely-made/dramatis.git"
branch = "main"

[workspace.dependencies.servitor]
git = "https://www.github.com/merely-made/eidetic.git"
rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31"

[workspace.dependencies.stickleback]
git = "https://www.github.com/merely-made/eidetic.git"
rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31"

[workspace.dependencies.proofs]
package = "mere-proofs"
git = "https://www.github.com/merely-made/eidetic.git"
rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31"

[workspace.dependencies.mooting]
version = "0.1.0"
path = "crates/mooting"

[workspace.dependencies.mien]
version = "0.0.1"
path = "crates/mien"

[workspace.dependencies.muniment]
git = "https://www.github.com/merely-made/eidetic.git"
rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31"

[workspace.dependencies.chartulary]
git = "https://www.github.com/merely-made/eidetic.git"
rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31"

[workspace.dependencies.transport]
package = "mere-transport"
version = "0.0.2"
git = "https://www.github.com/merely-made/murm.git"
rev = "bc82e1aa92e4076bd12b1910b3fe3ab992b7acb8"

[workspace.dependencies.errand]
version = "0.4.0"
git = "https://github.com/merely-made/errand.git"
rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97"

[workspace.dependencies.gemini-protocol]
version = "=0.1.7"
git = "https://github.com/merely-made/errand.git"
rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97"

[workspace.dependencies.eidetic]
version = "0.0.3"
default-features = false
git = "https://www.github.com/merely-made/eidetic.git"
rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31"

[workspace.dependencies.gemot]
version = "0.1.1"
path = "crates/gemot"

[workspace.dependencies.eidetic-search]
git = "https://www.github.com/merely-made/eidetic.git"
rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31"
default-features = false

[workspace.dependencies.personae]
version = "0.3.0"
git = "https://github.com/merely-made/dramatis.git"
branch = "main"

[workspace.dependencies.murm]
version = "0.0.1"
git = "https://www.github.com/merely-made/murm.git"
rev = "bc82e1aa92e4076bd12b1910b3fe3ab992b7acb8"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch."https://github.com/merely-made/gemot.git".gemot]
path = "crates/gemot"

[patch."https://github.com/merely-made/gemot.git".mooting]
path = "crates/mooting"

[patch."https://github.com/merely-made/gemot.git".mien]
