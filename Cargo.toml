[workspace]
resolver = "2"
members = [
    "crates/gemot",
    "crates/mooting",
    "crates/mien",
    "crates/moothold",
    "crates/commons",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/gemot"
authors = [
    "Mark AB (markik)",
]

[workspace.dependencies]
serde_json = "1"

[workspace.dependencies.insigne]
version = "0.0.2"
git = "https://github.com/merely-made/dramatis.git"
branch = "main"

[workspace.dependencies.identity]
package = "personae"
version = "0.3.0"
git = "https://github.com/merely-made/dramatis.git"
branch = "main"

[workspace.dependencies.servitor]
git = "https://github.com/merely-made/eidetic.git"
rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943"

[workspace.dependencies.stickleback]
git = "https://github.com/merely-made/eidetic.git"
rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943"

[workspace.dependencies.proofs]
package = "mere-proofs"
git = "https://github.com/merely-made/eidetic.git"
rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943"

[workspace.dependencies.mooting]
version = "0.1.0"
path = "crates/mooting"

[workspace.dependencies.mien]
version = "0.0.1"
path = "crates/mien"

[workspace.dependencies.muniment]
git = "https://github.com/merely-made/eidetic.git"
rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943"

[workspace.dependencies.chartulary]
git = "https://github.com/merely-made/eidetic.git"
rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943"

[workspace.dependencies.transport]
package = "mere-transport"
version = "0.0.2"
git = "https://github.com/merely-made/murm.git"
branch = "main"

[workspace.dependencies.errand]
version = "0.4.0"
git = "https://github.com/merely-made/errand.git"
rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97"

[workspace.dependencies.gemini-protocol]
version = "=0.1.7"
git = "https://github.com/merely-made/errand.git"
rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97"

[workspace.dependencies.eidetic]
version = "0.0.2"
default-features = false
git = "https://github.com/merely-made/eidetic.git"
rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943"

[workspace.dependencies.gemot]
version = "0.1.1"
path = "crates/gemot"

[workspace.dependencies.personae]
version = "0.3.0"
git = "https://github.com/merely-made/dramatis.git"
branch = "main"

[workspace.dependencies.murm]
version = "0.0.1"
git = "https://github.com/merely-made/murm.git"
branch = "main"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

[patch."https://github.com/merely-made/gemot.git".gemot]
path = "crates/gemot"

[patch."https://github.com/merely-made/gemot.git".mooting]
